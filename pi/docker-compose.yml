services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    env_file:
      - .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=span
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.pianohouseproject.org
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.resend.com:465
      - GF_SMTP_USER=resend
      - GF_SMTP_PASSWORD=${RESEND_API_KEY}
      - GF_SMTP_FROM_ADDRESS=grafana@pianohouseproject.org
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    depends_on:
      - influxdb

  collector:
    build: .
    container_name: span-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
      - SPAN_PANEL_IP=192.168.4.72
      - POLL_INTERVAL=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

  bath-detector:
    build: .
    container_name: bath-detector
    restart: unless-stopped
    command: ["python", "-u", "bath_detector.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
    depends_on:
      - influxdb

  charge-detector:
    build: .
    container_name: charge-detector
    restart: unless-stopped
    command: ["python", "-u", "charge_detector.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
    depends_on:
      - influxdb

  daily-report:
    build: .
    container_name: daily-report
    restart: unless-stopped
    command: ["python", "-u", "daily_report.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
      - RESEND_API_KEY=${RESEND_API_KEY}
      - REPORT_EMAIL=${REPORT_EMAIL}
      - TZ=America/Los_Angeles
    depends_on:
      - influxdb

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: span-web
    restart: unless-stopped
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUXDB_TOKEN}
      - INFLUX_ORG=home
      - INFLUX_BUCKET=span
    depends_on:
      - influxdb

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - grafana
      - web

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
