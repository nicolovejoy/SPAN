# Telegraf host + container metrics for Pi observability (#16 Task 5).
#
# Writes to the `telemetry` bucket (30d retention) in the same InfluxDB
# instance as the `span` bucket -- separate bucket so this operational data
# doesn't mix with panel telemetry or affect its infinite retention.
# See pi/influx_tasks/README.md for the bucket note.

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "0s"
  hostname = "phrpi"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUXDB_TOKEN"
  organization = "home"
  bucket = "telemetry"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

# The host root is bind-mounted read-only at /hostfs (see docker-compose.yml)
# and HOST_MOUNT_PREFIX=/hostfs makes telegraf transparently prefix "/" to
# "/hostfs" when statting it, while still reporting it under the host-facing
# path "/" -- verified with `--test`: reports the Pi's real ~123GB root fs,
# not the container's tiny overlay. An explicit "/hostfs" entry in
# mount_points is unnecessary (it would double-prefix to /hostfs/hostfs,
# which doesn't exist, and silently emits nothing) so it's deliberately left
# out.
[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.system]]

# Pi SoC temperature -- reads from /sys via HOST_SYS (see docker-compose.yml
# environment: HOST_SYS=/hostfs/sys). If this yields nothing on a given host,
# keep the input anyway (harmless no-op) rather than removing it.
[[inputs.temp]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["*"]
  perdevice_include = ["cpu", "network", "blkio"]
  total_include = ["cpu", "network", "blkio"]
